                  quality: Fast
              Seedance 2.5:
                summary: Seedance 2.5
                value:
                  model: seedance-2.5
                  prompt: A cinematic tracking shot through a rain-lit night market.
                  duration: 5
                  aspect_ratio: '16:9'
                  resolution: 720p
                  generate_audio: true
                  seed: -1
              Kling 3:
                summary: Kling 3
                value:
                  model: kling-3
                  prompt: A dramatic product reveal with a slow orbiting camera move.
                  duration: 5
                  aspect_ratio: '16:9'
                  resolution: pro
