      description: Multi-shot mode accepts one first-frame image, requires `multi_prompt`, and defaults sound to true. Shot durations must sum to `duration`.
      properties:
        model: { type: string, const: kling-3, description: Must be `kling-3`. }
        prompt: { type: string, minLength: 1, maxLength: 5000, description: Video generation instructions. }
        images: { type: array, minItems: 1, maxItems: 2, description: One first-frame image or first- and last-frame images as public HTTPS URLs. Multi-shot mode accepts exactly one., items: { type: string, format: uri, pattern: '^https://' } }
        duration: { type: integer, minimum: 3, maximum: 15, default: 5, description: Requested output duration in seconds. }
        aspect_ratio:
          type: string
          enum: ['16:9', '9:16', '1:1']
          description: Defaults to 16:9 for text generation. Omit it with frame images to adapt to the input aspect ratio.
        resolution: { type: string, enum: [std, pro, 4K], default: pro, description: Output quality tier. }
        sound: { type: boolean, description: Generate synchronized sound. Defaults to true in multi-shot mode. }
        multi_shots: { type: boolean, default: false, description: Enable storyboard-style multi-shot generation. }
        multi_prompt:
          type: array
          minItems: 1
          maxItems: 5
          description: Shot definitions required when `multi_shots=true`.
          items: { $ref: '#/components/schemas/KlingShot' }
        elements:
          type: array
          maxItems: 3
          description: Up to three reusable subject or object references.
          items: { $ref: '#/components/schemas/KlingElement' }
    Kling26MotionControlVideoRequest:
      type: object
      additionalProperties: false
      required: [model, images, reference_videos]
      description: |
        Transfer motion from one uploaded 3–30 second MP4/MOV video to one
        uploaded character image. Both URLs must come from `/v1/files` for the
        current BeatAPI account. BeatAPI detects the reference-video duration
        server-side and reserves USD at the selected per-second rate, rounding
        fractional seconds up. The image must be 10 MB or smaller; the video
        may be up to 100 MB.
      properties:
        model: { type: string, const: kling-2.6-motion-control, description: Must be `kling-2.6-motion-control`. }
        prompt: { type: string, maxLength: 2500, description: Optional motion or scene guidance. }
        images:
          type: array
          minItems: 1
          maxItems: 1
          description: Exactly one character-image URL returned by the current account's `/v1/files` upload.
          items: { type: string, format: uri, pattern: '^https://' }
        reference_videos:
          type: array
          minItems: 1
          maxItems: 1
          description: Exactly one 3–30 second MP4/MOV URL returned by the current account's `/v1/files` upload. Its detected duration determines billing.
          items: { type: string, format: uri, pattern: '^https://' }
        resolution: { type: string, enum: [720p, 1080p], default: 720p, description: Output resolution and per-second price tier. }
        character_orientation: { type: string, enum: [image, video], default: image, description: Image orientation supports motion videos up to 10 seconds; video orientation supports up to 30 seconds. }
    Kling3MotionControlVideoRequest:
      type: object
      additionalProperties: false
      required: [model, images, reference_videos]
      description: |
        Kling 3.0 motion transfer using exactly one uploaded image and one
        uploaded 3–30 second MP4/MOV. Both assets must exceed 340 px in width
        and height and use an aspect ratio from 2:5 to 5:2. BeatAPI detects the
        reference-video duration server-side and reserves USD at the selected
        per-second rate, rounding fractional seconds up.
      properties:
        model: { type: string, const: kling-3-motion-control, description: Must be `kling-3-motion-control`. }
        prompt: { type: string, maxLength: 2500, description: Optional motion or scene guidance. }
        images:
          type: array
          minItems: 1
          maxItems: 1
          description: Exactly one character-image URL returned by the current account's `/v1/files` upload; maximum 10 MB.
          items: { type: string, format: uri, pattern: '^https://' }
        reference_videos:
          type: array
          minItems: 1
          maxItems: 1
          description: Exactly one 3–30 second MP4/MOV URL returned by the current account's `/v1/files` upload; maximum 100 MB. Its detected duration determines billing.
          items: { type: string, format: uri, pattern: '^https://' }
        resolution: { type: string, enum: [720p, 1080p], default: 720p, description: Output resolution and per-second price tier. }
        character_orientation: { type: string, enum: [image, video], default: image, description: Image orientation supports motion videos up to 10 seconds; video orientation supports up to 30 seconds. }
        background_source: { type: string, enum: [input_video, input_image], default: input_video, description: Preserve the background from the motion video or character image. }
    Wan30VideoRequest:
      type: object
      additionalProperties: false
      required: [model, prompt]
      description: 'Renders 2–30 seconds in a single pass. `images` starts the render from a picture; reference videos and audio travel alongside it.'
