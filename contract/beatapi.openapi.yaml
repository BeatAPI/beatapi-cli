        `GET /v1/tasks/{task_id}` until the task succeeds or fails.
      security: [{ BearerAuth: [] }]
      parameters:
        - in: header
          name: Idempotency-Key
          required: false
          schema: { type: string, maxLength: 255 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VideoGenerationTaskCreateRequest' }
            examples:
              MiniMax H3:
