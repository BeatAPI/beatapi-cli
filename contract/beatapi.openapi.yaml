                  model: seedance-2
                  prompt: A handheld tracking shot through a crowded neon night market.
                  duration: 8
                  aspect_ratio: '16:9'
                  resolution: 1080p
                  generate_audio: true
              Seedance 2 Fast:
                summary: Seedance 2 Fast
                value:
                  model: seedance-2-fast
