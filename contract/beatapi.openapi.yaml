        images: { type: array, minItems: 1, maxItems: 2, description: 'Public HTTPS images. One starts the render from a first frame; a second becomes the last frame, in first-to-last order.', items: { type: string, format: uri, pattern: '^https://' } }
        duration: { type: integer, minimum: 1, default: 5, description: 'Requested output duration in seconds. Billed per second at the rate for the chosen resolution. If a duration is unsupported, the API returns `400`.' }
        resolution: { type: string, enum: ['480P', '768P'], default: '768P', description: 'Output resolution. Upper-case P, and the only two values this model accepts. Price scales with it.' }
        seed: { type: integer, minimum: 0, description: Reuse a seed to re-render the same motion. A random seed is chosen when omitted. }
    TaskResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/Task'
          description: Accepted or current BeatAPI task state.
    Usage:
      type: object
      required: [object, credit_balance, total_tasks, credits_settled, credits_refunded, concurrency, by_workflow, by_capability, by_model, by_api_key]
      properties:
        object:
          type: string
          enum: [usage]
        credit_balance:
          type: number
          format: double
          multipleOf: 0.01
          description: Current USD balance. The compatibility field name is retained; 1 Credit equals $1 USD. The balance may be negative.
        total_tasks:
          type: integer
        credits_settled:
          type: number
          format: double
          multipleOf: 0.01
        credits_refunded:
          type: number
          format: double
          multipleOf: 0.01
        concurrency:
          type: object
          required: [limit, active]
          properties:
            limit:
              type: integer
              example: 2
            active:
              type: integer
              description: Active processing tasks currently using BeatAPI processing resources. Music Video storyboard_ready and requires_action tasks can have settled USD usage without counting toward this value.
        by_workflow:
          type: array
          description: Compatibility view containing workflow tasks only. Image, video, and Effect tasks are reported under by_capability instead.
          items:
            type: object
            required: [workflow, tasks, credits_settled]
            properties:
              workflow:
                type: string
                enum: [music-video, ecommerce-video, video-analysis]
              tasks:
                type: integer
              credits_settled:
                type: number
                format: double
                multipleOf: 0.01
        by_capability:
          type: array
          items:
            type: object
            required: [task_kind, capability_id, tasks, credits_settled]
            properties:
              task_kind:
                type: string
                enum: [workflow, effect, image, video]
              capability_id:
                type: string
              tasks:
                type: integer
              credits_settled:
                type: number
                format: double
                multipleOf: 0.01
        by_model:
          type: array
          items:
            type: object
            required: [media_type, model, tasks, credits_settled]
            properties:
              media_type:
                type: string
                enum: [image, video]
              model:
                type: string
              tasks:
                type: integer
              credits_settled:
                type: number
                format: double
                multipleOf: 0.01
        by_api_key:
          type: array
          items:
            type: object
            required: [api_key_id, title, key_prefix, tasks, credits_settled]
            properties:
              api_key_id: { type: string }
              title: { type: string }
              key_prefix: { type: string }
              tasks: { type: integer }
              credits_settled: { type: number, format: double, multipleOf: 0.01 }
        realtime:
          type: object
          required: [sessions, credits, active]
          properties:
            sessions:
              type: integer
              description: Total BeatAPI realtime sessions for this account.
            credits:
              type: number
              format: double
              multipleOf: 0.01
              description: USD amount settled by connected realtime sessions.
            active:
              type: integer
              description: Realtime sessions in ready, connecting, or active state.
    UsageResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/Usage'
    VideoAnalysisTaskCreateRequest:
      type: object
      additionalProperties: false
      required: [video_url, prompt]
      properties:
        video_url:
          type: string
          format: uri
          description: BeatAPI-hosted MP4 or MOV input URL returned by POST /v1/files for the current account. Maximum verified duration is 600 seconds.
        prompt:
          type: string
          minLength: 1
          maxLength: 12000
          description: Analysis instruction. Ask for timestamped output when temporal precision matters.
        analysis_depth:
          type: string
          enum: [standard, deep]
          default: standard
          description: Standard is the default low-cost route; deep uses the higher-reasoning route.
        max_output_tokens:
          type: integer
          minimum: 256
          maximum: 8192
          default: 2048
          description: Requested answer budget. Provider-reported output usage can include hidden reasoning tokens above this value; BeatAPI records the variance for audit and settles actual reported usage within the task reservation.
    MusicVideoTaskCreateRequest:
      oneOf:
        - $ref: '#/components/schemas/StandardMusicVideoTaskCreateRequest'
        - $ref: '#/components/schemas/PremiumMusicVideoTaskCreateRequest'
      discriminator:
        propertyName: mv_tier
        mapping:
          standard: '#/components/schemas/StandardMusicVideoTaskCreateRequest'
          premium: '#/components/schemas/PremiumMusicVideoTaskCreateRequest'
    StandardMusicVideoTaskCreateRequest:
      type: object
      required: [images, audio_url]
      allOf:
        - if:
            required: [lip_sync]
            properties:
              lip_sync: { const: true }
          then:
            required: [lip_ref_url]
            properties:
              lip_ref_url: {}
      not:
        anyOf:
          - required: [mv_mode]
            properties: { mv_mode: {} }
          - required: [lip_ref_urls]
            properties: { lip_ref_urls: {} }
      properties:
        mv_tier:
          type: string
          enum: [standard]
          default: standard
          description: May be omitted to preserve the backwards-compatible Standard contract.
        images:
          type: array
          minItems: 1
          maxItems: 7
          description: Standard scene images. Provide 1-7 public HTTPS PNG, JPEG, or WebP URLs; place the primary subject or opening scene first. Upload local files through `POST /v1/files` and use the returned `data.url`.
          items: { type: string, format: uri }
        audio_url:
          type: string
          format: uri
          description: Public HTTPS audio URL; Standard audio must be 10-180 seconds.
        prompt: { type: string, maxLength: 3000, description: "Optional creative direction for story, setting, performance, camera, lighting, and pacing. Maximum 3000 characters." }
        language: { type: string, enum: [en, zh], description: Dialogue and lyric language used by the Standard workflow. }
        quality: { type: string, enum: [standard, high], default: standard, description: Generation quality tier. High quality is unavailable at 540p. }
        style: { type: string, maxLength: 200, description: "Optional concise visual style, such as cinematic, anime, documentary, or fashion editorial." }
        aspect_ratio: { type: string, enum: ['1:1', '16:9', '9:16', '4:3', '3:4'], description: Target output placement. Set explicitly for the destination player or social feed. }
        resolution: { type: string, enum: [540p, 720p, 1080p], default: 720p, description: Output resolution. 540p cannot be combined with high quality or lip sync. }
        lip_sync:
          type: boolean
          default: false
          description: Generate lip-synchronized performance. When true, `lip_ref_url` is required.
        lip_ref_url:
          type: string
          format: uri
          description: Public HTTPS close-up, front-facing face image used for Standard lip sync.
        add_subtitle: { type: boolean, default: false, description: Burn generated or supplied subtitles into the final video. }
        subtitle_color: { type: string, pattern: '^#[0-9A-Fa-f]{6}$', example: '#FFFFFF', description: Subtitle text color as a six-digit hexadecimal value. Used when subtitles are enabled. }
        srt_url: { type: string, format: uri, description: Optional public HTTPS `.srt` subtitle file. Upload a local subtitle through `POST /v1/files`. }
        duration:
          type: integer
          minimum: 10
          maximum: 180
          description: Billing fallback only; detected audio duration wins.
        compose_mode:
          type: string
          enum: [auto, manual]
          default: auto
          description: Auto composes the final Music Video; manual pauses at `requires_action` so shots can be reviewed or edited before compose.
    PremiumMusicVideoTaskCreateRequest:
      allOf:
        - oneOf:
            - $ref: '#/components/schemas/PremiumMusicVideoSingTaskCreateRequest'
            - $ref: '#/components/schemas/PremiumMusicVideoSingPerformTaskCreateRequest'
            - $ref: '#/components/schemas/PremiumMusicVideoDanceTaskCreateRequest'
            - $ref: '#/components/schemas/PremiumMusicVideoPerformTaskCreateRequest'
      discriminator:
        propertyName: mv_mode
        mapping:
          sing: '#/components/schemas/PremiumMusicVideoSingTaskCreateRequest'
          sing_perform: '#/components/schemas/PremiumMusicVideoSingPerformTaskCreateRequest'
          dance: '#/components/schemas/PremiumMusicVideoDanceTaskCreateRequest'
          perform: '#/components/schemas/PremiumMusicVideoPerformTaskCreateRequest'
    PremiumMusicVideoTaskRequestBase:
      type: object
      required: [mv_tier, mv_mode, audio_url]
      not:
        anyOf:
          - required: [quality]
            properties: { quality: {} }
          - required: [language]
            properties: { language: {} }
          - required: [lip_sync]
            properties: { lip_sync: {} }
          - required: [lip_ref_url]
            properties: { lip_ref_url: {} }
          - required: [srt_url]
            properties: { srt_url: {} }
          - required: [compose_mode]
            properties: { compose_mode: {} }
      properties:
        mv_tier: { type: string, enum: [premium], description: Selects the Premium Music Video workflow and its mode-specific inputs. }
        mv_mode: { type: string, enum: [sing, sing_perform, dance, perform], description: Premium performance mode. Sing modes require `lip_ref_urls`; dance and perform require exactly six `images`. }
        audio_url:
          type: string
          format: uri
          description: Public HTTPS audio URL; Premium audio must be 10-300 seconds.
        prompt: { type: string, maxLength: 3000, description: "Optional creative direction for story, setting, performance, camera, lighting, and pacing. Maximum 3000 characters." }
        style: { type: string, maxLength: 200 }
        aspect_ratio: { type: string, enum: ['1:1', '16:9', '9:16', '4:3', '3:4'], description: Target output placement. Set explicitly for the destination player or social feed. }
        resolution:
          type: string
          enum: [720p]
          default: 720p
          description: Premium output is fixed to 720p.
        add_subtitle: { type: boolean, default: false, description: Burn generated subtitles into the final video. }
        subtitle_color: { type: string, pattern: '^#[0-9A-Fa-f]{6}$', example: '#FFFFFF', description: Subtitle text color as a six-digit hexadecimal value. Used when subtitles are enabled. }
        duration:
          type: integer
          minimum: 10
          maximum: 300
          description: Premium billing fallback only; detected audio duration wins.
    PremiumMusicVideoSingTaskCreateRequest:
      allOf:
        - $ref: '#/components/schemas/PremiumMusicVideoTaskRequestBase'
        - type: object
          required: [lip_ref_urls]
          properties:
            mv_mode: { type: string, enum: [sing] }
            images:
              type: array
              minItems: 0
              maxItems: 6
              description: Optional Premium scene images for sing mode. Provide up to six public HTTPS PNG, JPEG, or WebP URLs.
              items: { type: string, format: uri }
            lip_ref_urls:
              type: array
              minItems: 1
              maxItems: 2
              description: Required for sing mode. One or two public HTTPS close-up, front-facing face images for lip synchronization.
              items: { type: string, format: uri }
    PremiumMusicVideoSingPerformTaskCreateRequest:
      allOf:
        - $ref: '#/components/schemas/PremiumMusicVideoTaskRequestBase'
        - type: object
          required: [lip_ref_urls]
          properties:
            mv_mode: { type: string, enum: [sing_perform] }
            images:
              type: array
              minItems: 0
              maxItems: 6
              description: Optional Premium scene images for sing and perform mode. Provide up to six public HTTPS PNG, JPEG, or WebP URLs.
              items: { type: string, format: uri }
            lip_ref_urls:
              type: array
              minItems: 1
              maxItems: 2
              description: Required for sing and perform mode. One or two public HTTPS close-up, front-facing face images for lip synchronization.
              items: { type: string, format: uri }
    PremiumMusicVideoDanceTaskCreateRequest:
      allOf:
        - $ref: '#/components/schemas/PremiumMusicVideoTaskRequestBase'
        - type: object
          required: [images]
          not:
            required: [lip_ref_urls]
            properties: { lip_ref_urls: {} }
          properties:
            mv_mode: { type: string, enum: [dance] }
            images:
              type: array
              minItems: 6
              maxItems: 6
              description: Required for dance mode. Provide exactly six public HTTPS PNG, JPEG, or WebP scene images.
              items: { type: string, format: uri }
    PremiumMusicVideoPerformTaskCreateRequest:
      allOf:
        - $ref: '#/components/schemas/PremiumMusicVideoTaskRequestBase'
        - type: object
          required: [images]
          not:
            required: [lip_ref_urls]
            properties: { lip_ref_urls: {} }
          properties:
            mv_mode: { type: string, enum: [perform] }
            images:
              type: array
              minItems: 6
              maxItems: 6
              description: Required for perform mode. Provide exactly six public HTTPS PNG, JPEG, or WebP scene images.
              items: { type: string, format: uri }
    EditMusicVideoShotRequest:
      type: object
      additionalProperties: false
      required: [prompt]
      properties:
        prompt:
          type: string
          maxLength: 3000
        images:
          type: array
          minItems: 0
          maxItems: 6
          description: Premium tasks only. Optional replacement scene images; an empty array is treated as omitted. Standard tasks reject this field.
          items: { type: string, format: uri }
    RealtimeSession:
      type: object
      required: [id, object, status, expires_at, max_duration_seconds, allowed_origins, credits, request_id, created_at, connected_at, closed_at]
      properties:
        id:
          type: string
          pattern: '^rts_'
          description: Stable Realtime Session ID used to inspect or close the session.
        object:
          type: string
          enum: [realtime.session]
          description: Object discriminator; always `realtime.session`.
        status:
          type: string
          enum: [ready, connecting, active, closed, failed, expired]
          description: Active means BeatAPI accepted the first billing heartbeat after remote output began.
        expires_at:
          type: string
          format: date-time
          description: Time when the unconnected short-lived session credential expires.
        max_duration_seconds:
          type: integer
          enum: [15, 60, 300]
          description: Maximum selected live duration and billing tier in seconds.
        allowed_origins:
          type: array
          description: Exact browser origins authorized to use this Session.
          items:
            type: string
            format: uri
            pattern: '^(https://[A-Za-z0-9.-]+(?::[0-9]+)?|http://(?:localhost|127\\.0\\.0\\.1|\\[::1\\])(?::[0-9]+)?)$'
            description: Exact browser origin. Use HTTPS in production; HTTP is accepted only for localhost development.
            example: https://app.example.com
        credits:
          type: object
          required: [reserved, settled, refunded]
          description: USD reservation, settlement, and refund lifecycle for this Realtime Session. Compatibility field names are retained.
          properties:
            reserved: { type: number, format: double, multipleOf: 0.01, description: USD amount reserved when the Session is created. }
            settled: { type: number, format: double, multipleOf: 0.01, description: USD amount settled after the first accepted billing heartbeat. }
            refunded: { type: number, format: double, multipleOf: 0.01, description: USD amount refunded if the Session ends without billing activation. }
        request_id:
          type: string
          description: Correlation ID to retain for logs and BeatAPI support.
        created_at: { type: string, format: date-time, description: Time when the Session was created. }
        connected_at:
          type: [string, 'null']
          format: date-time
          description: Time of the first accepted BeatAPI billing heartbeat; null before billing activation.
        closed_at: { type: [string, 'null'], format: date-time, description: "Time when the Session closed, or null while it remains open." }
    RealtimeSessionCreated:
      allOf:
        - $ref: '#/components/schemas/RealtimeSession'
        - type: object
          required: [client_secret]
          properties:
            client_secret:
              type: string
              description: Short-lived BeatAPI browser credential returned only by POST. Never expose an sk_ API key to the browser.
              pattern: '^brt_live_'
    RealtimeSessionCreateResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/RealtimeSessionCreated'
          description: Created Realtime Session including the one-time short-lived browser credential.
    RealtimeSessionResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/RealtimeSession'
    FileResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/File'
          description: Uploaded file metadata and the public HTTPS URL to use in later requests.
    WebhookEndpointList:
      type: object
      required: [object, data]
      properties:
        object:
          type: string
          enum: [list]
        data:
          type: array
          items:
            $ref: '#/components/schemas/WebhookEndpoint'
    WebhookEndpointListResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/WebhookEndpointList'
    WebhookEndpointResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/WebhookEndpoint'
          description: Created or retrieved webhook endpoint. Public API responses return the full signing secret at creation and mask it afterward; authenticated dashboard owners can explicitly reveal it again.
    DeleteResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [id, deleted]
          properties:
            id:
              type: string
            deleted:
              type: boolean
    CapabilityContract:
      type: object
      required: [reference, kind, id, version, status, title, description, execution, versions, validation]
      properties:
        reference: { type: string }
        kind: { type: string, enum: [model, data, workflow] }
        id: { type: string }
        version: { type: string }
        status: { type: string }
        title: { type: string }
        description: { type: string }
        categories: { type: array, items: { type: string } }
        platforms: { type: array, items: { type: string } }
        entities: { type: array, items: { type: string } }
        operations: { type: array, items: { type: string } }
        input_schema: { type: object, additionalProperties: true }
        output_schema: { type: object, additionalProperties: true }
        pagination: { type: object, additionalProperties: true }
        limits: { type: object, additionalProperties: true }
        errors: { type: object, additionalProperties: true }
        execution:
          type: object
          required: [mode, status_supported]
          properties:
            mode: { type: string, enum: [sync, async] }
            status_supported: { type: boolean }
            result_location: { type: string }
        versions:
          type: object
          required: [catalog_version, contract_version]
          properties:
            catalog_version: { type: string }
            contract_version: { type: string }
            price_version: { type: string }
        validation:
          type: object
          required: [state]
          properties:
            state: { type: string, enum: [verified, partial, unknown] }
            verified_at: { type: string }
            evidence: { type: array, items: { type: string } }
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          description: Structured BeatAPI error. Use `code` for program logic and retain `request_id` for support.
          required: [code, message, request_id]
          properties:
            code:
              type: string
              description: Stable machine-readable error code.
              enum:
                - bad_request
                - unauthorized
                - forbidden
                - not_found
                - insufficient_credits
                - idempotency_conflict
                - user_concurrency_exceeded
                - rate_limit_exceeded
                - content_policy_violation
                - processing_unavailable
                - processing_failed
                - processing_timeout
                - result_transfer_failed
                - invalid_signature
                - realtime_disabled
                - realtime_capacity_unavailable
                - realtime_session_expired
                - origin_not_allowed
                - invalid_client_secret
                - transport_not_allowed
                - internal_error
            message:
              type: string
              description: Human-readable detail intended for logs and debugging.
            request_id:
              type: string
              description: Correlation ID to retain for BeatAPI support.
            retry_after_seconds:
              type: integer
              description: Present on retryable rate-limit or capacity responses when the client should wait before retrying.
  responses:
    Unauthorized:
      description: Missing, invalid, or inactive API key.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: unauthorized
              message: Missing or invalid API key.
              request_id: req_xxx
    BadRequest:
      description: Invalid request.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: bad_request
              message: images must contain 1-7 public HTTPS URLs.
              request_id: req_xxx
    RateLimited:
      description: Request rate limit exceeded.
      headers:
        Retry-After:
          description: Seconds to wait before retrying the request.
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: rate_limit_exceeded
              message: Too many polling requests. Poll every 5-10 seconds.
              request_id: req_xxx
              retry_after_seconds: 12
    InternalError:
      description: BeatAPI could not complete the request because of an internal or storage failure.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: internal_error
              message: Internal error. Contact support with the request_id if the problem continues.
              request_id: req_xxx
    ProcessingUnavailable:
      description: BeatAPI processing is temporarily unavailable or did not complete within the processing window.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: processing_unavailable
              message: Task processing is temporarily unavailable.
              request_id: req_xxx
    NotFound:
      description: The requested capability or task does not exist for this account.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: not_found
              message: The requested resource was not found.
              request_id: req_xxx
    InsufficientCredits:
      description: Account balance is insufficient for the requested paid operation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: insufficient_credits
              message: Account balance is not sufficient for this task.
              request_id: req_xxx
    Conflict:
      description: The idempotency key conflicts with an existing request.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: idempotency_conflict
              message: This Idempotency-Key was already used with a different request body.
              request_id: req_xxx
    BadGateway:
      description: The task could not be completed by the processing service.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: processing_failed
              message: Task failed during processing.
              request_id: req_xxx
paths:
  /v1/models:
    get:
      operationId: listTextModels
      tags: [Text]
      summary: List available text models
      description: Returns the text models currently enabled for this BeatAPI environment in OpenAI list format.
      security:
        - BearerAuth: []
        - ApiKeyHeader: []
        - GoogleApiKeyHeader: []
      responses:
        '200':
          description: OpenAI-compatible model list
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TextModelList' }
              example:
                object: list
                data:
                  - id: gpt-5.6-sol
                    object: model
                    created: 1788220800
                    owned_by: beatapi
                  - id: gpt-5.6-terra
                    object: model
                    created: 1788220800
                    owned_by: beatapi
                  - id: gpt-5.6-luna
                    object: model
                    created: 1788220800
                    owned_by: beatapi
                  - id: claude-fable-5-1
                    object: model
                    created: 1788220800
                    owned_by: beatapi
        '401': { description: Invalid or missing BeatAPI API key }
        '404': { description: Text API is not enabled for this environment }
        '429': { description: Request rate limit exceeded }

  /v1/responses:
    post:
      operationId: createTextResponse
      tags: [Text]
      summary: Create a text response
      description: Recommended OpenAI-compatible surface for reasoning, tools, structured outputs, and streaming.
      security:
        - BearerAuth: []
        - ApiKeyHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TextPassthroughRequest' }
            example:
              model: gpt-5.6-sol
              input: Design a resilient webhook retry strategy for a payments API.
              reasoning: { effort: medium }
              stream: true
      responses:
        '200':
          description: OpenAI-compatible JSON response or server-sent event stream
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TextPassthroughResponse' }
            text/event-stream:
              schema: { type: string }
        '401': { description: Invalid or missing BeatAPI API key }
        '402': { description: Insufficient BeatAPI USD balance }
        '429': { description: Rate limit or settlement backlog }
        '502': { description: Text gateway could not complete the request }
        '503': { description: Text service is temporarily unavailable }

  /v1/chat/completions:
    post:
      operationId: createChatCompletion
      tags: [Text]
      summary: Create a text chat completion
      description: OpenAI Chat Completions-compatible endpoint for existing SDK integrations.
      security:
        - BearerAuth: []
        - ApiKeyHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TextPassthroughRequest' }
            example:
              model: gpt-5.6-terra
              messages:
                - role: user
                  content: Summarize the attached product requirements into an implementation plan.
              stream: true
      responses:
        '200':
          description: OpenAI-compatible JSON response or server-sent event stream
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TextPassthroughResponse' }
            text/event-stream:
              schema: { type: string }
        '401': { description: Invalid or missing BeatAPI API key }
        '402': { description: Insufficient BeatAPI USD balance }
        '429': { description: Rate limit or settlement backlog }
        '502': { description: Text gateway could not complete the request }
        '503': { description: Text service is temporarily unavailable }

  /v1/messages:
    post:
      operationId: createMessage
      tags: [Text]
      summary: Create an Anthropic-compatible message
      description: Anthropic Messages-compatible endpoint. Send the BeatAPI key with x-api-key or Bearer authentication.
      security:
        - ApiKeyHeader: []
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TextPassthroughRequest' }
            example:
              model: gpt-5.6-luna
              max_tokens: 1024
              messages:
                - role: user
                  content: Classify this support request and return JSON.
      responses:
        '200':
          description: Anthropic-compatible JSON response or server-sent event stream
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TextPassthroughResponse' }
            text/event-stream:
              schema: { type: string }
        '401': { description: Invalid or missing BeatAPI API key }
        '402': { description: Insufficient BeatAPI USD balance }
        '429': { description: Rate limit or settlement backlog }
        '502': { description: Text gateway could not complete the request }
        '503': { description: Text service is temporarily unavailable }

  /v1beta/models/{model}:{action}:
    post:
      operationId: generateGeminiCompatibleContent
      tags: [Text]
      summary: Generate text content with a Gemini-compatible request
      description: Gemini-compatible endpoint for generateContent and streamGenerateContent. The BeatAPI key is removed before forwarding.
      security:
        - GoogleApiKeyHeader: []
        - GoogleApiKeyQuery: []
        - BearerAuth: []
      parameters:
        - in: path
          name: model
          required: true
          schema: { $ref: '#/components/schemas/TextModelId' }
        - in: path
          name: action
          required: true
          schema: { type: string, enum: [generateContent, streamGenerateContent] }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
            example:
              contents:
                - role: user
                  parts:
                    - text: Explain this architecture decision in three concise bullets.
      responses:
        '200':
          description: Gemini-compatible JSON response or server-sent event stream
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TextPassthroughResponse' }
            text/event-stream:
              schema: { type: string }
        '401': { description: Invalid or missing BeatAPI API key }
        '402': { description: Insufficient BeatAPI USD balance }
        '429': { description: Rate limit or settlement backlog }
        '502': { description: Text gateway could not complete the request }
        '503': { description: Text service is temporarily unavailable }

  /v1/workflows:
    get:
      operationId: listWorkflows
      tags: [Workflows]
      x-apidog-folder: Reference/API Overview
      summary: List launch workflows
      security: []
      responses:
        '200':
          description: Workflow list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowListResponse'
              example:
                data:
                  object: list
                  data:
                    - id: music-video
                      object: workflow
                      name: Music Video API
                      description: Generate short music video clips from audio, lyrics, and visual direction.
                    - id: ecommerce-video
                      object: workflow
                      name: Ecommerce Video API
                      description: Generate product ad videos from product images and a short creative brief.
                    - id: video-analysis
                      object: workflow
                      name: Video Analysis API
                      description: Analyze an uploaded video with timestamp-aware multimodal reasoning.
        '429':
          $ref: '#/components/responses/RateLimited'

  /v1/media/models:
    get:
      operationId: listGenerationModels
      tags: [Generation]
      summary: List BeatAPI image and video generation models
      description: Returns stable BeatAPI model aliases and public input modes. Internal execution routing is not part of this contract.
      security: []
      parameters:
        - in: query
          name: media_type
          schema: { type: string, enum: [image, video] }
      responses:
        '200':
          description: Generation model list
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GenerationModelListResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /v1/images/tasks:
    post:
      operationId: createImageGenerationTask
      tags: [Generation]
      summary: Create an image generation task
      description: |
        Creates one asynchronous image task. Select the model-specific request
        contract with `model`, save the returned `data.id`, and poll
        `GET /v1/tasks/{task_id}` until the task succeeds or fails.
      security: [{ BearerAuth: [] }]
      parameters:
        - in: header
          name: Idempotency-Key
          required: false
          schema: { type: string, maxLength: 255 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ImageGenerationTaskCreateRequest' }
            examples:
              Nano Banana:
                summary: Nano Banana
                value:
                  model: nano-banana
                  prompt: Editorial product photograph on a warm stone pedestal.
                  aspect_ratio: '1:1'
                  output_format: png
              Nano Banana 2:
                summary: Nano Banana 2 at 2K
                value:
                  model: nano-banana-2
                  prompt: Editorial campaign image with crisp product typography.
                  aspect_ratio: '4:5'
                  resolution: 2K
                  output_format: png
              Nano Banana 2 Lite:
                summary: Nano Banana 2 Lite at 1K
                value:
                  model: nano-banana-2-lite
                  prompt: Fast social product visual on a clean studio background.
                  aspect_ratio: '1:1'
                  output_format: jpeg
              Nano Banana Pro:
                summary: Nano Banana Pro
                value:
                  model: nano-banana-pro
                  prompt: Place the supplied product in a premium editorial studio scene.
                  images: ['https://media.beatapi.io/samples/smart-bottle.png']
                  aspect_ratio: '4:5'
                  resolution: 2K
                  output_format: png
              GPT Image 2:
                summary: GPT Image 2
                value:
                  model: gpt-image-2
                  prompt: Create a clean campaign image from the supplied product reference.
                  images: ['https://media.beatapi.io/samples/smart-bottle.png']
                  aspect_ratio: '1:1'
                  resolution: 2K
              Seedream 5 Pro:
                summary: Seedream 5 Pro
                value:
                  model: seedream-5-pro
                  prompt: Recompose the product as a cinematic storefront campaign image.
                  images: ['https://media.beatapi.io/samples/smart-bottle.png']
              Grok Imagine Image 2.0:
                summary: Grok Imagine Image 2.0
                value:
                  model: grok-imagine-image-2.0
                  prompt: Turn the supplied product into a bold launch campaign visual.
                  images: ['https://media.beatapi.io/samples/smart-bottle.png']
                  aspect_ratio: '16:9'
      responses:
        '201':
          description: Image generation task accepted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskResponse' }
              examples:
                Nano Banana Pro:
                  summary: Nano Banana Pro
                  value:
                    data:
                      id: task_8K2qA
                      object: task
                      task_kind: image
                      capability_id: nano-banana-pro
                      capability_version: null
                      media_type: image
                      model: nano-banana-pro
                      status: queued
                      stage: queued
                      created_at: 1782210000
                      updated_at: 1782210000
                      completed_at: null
                      output: null
                      usage:
                        credits_reserved: 0.09
                        credits_charged: 0.09
                        credits_settled: 0
                        credits_refunded: 0
                      request_id: req_abc123
                      error_code: null
                      error_message: null
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { description: Insufficient USD balance, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '409': { description: Idempotency key conflicts with another request body, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '429': { $ref: '#/components/responses/RateLimited' }

  /v1/videos/tasks:
    post:
      operationId: createVideoGenerationTask
      tags: [Generation]
      summary: Create a video generation task
