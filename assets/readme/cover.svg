<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
  <title id="title">BeatAPI CLI + SDK</title>
  <desc id="desc">Route Agent capabilities from terminal and TypeScript</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#7d8590" stroke-opacity=".12"/></pattern>
    <linearGradient id="connector"><stop stop-color="#2563FF"/><stop offset="1" stop-color="#7d8590"/></linearGradient>
  </defs>
  <style>
    .sans { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace; }
    .serif { font-family: Georgia, "Times New Roman", serif; }
    .small { font-size: 18px; font-weight: 700; } .tiny { font-size: 14px; font-weight: 600; } .symbol { font-size: 34px; font-weight: 800; }
  </style>
  <rect width="1200" height="400" rx="24" fill="#0b0f14"/>
  <rect width="1200" height="400" rx="24" fill="url(#grid)" opacity=".45"/>
  <text x="72" y="72" fill="#2563FF" class="mono small" letter-spacing="2">AGENT ROUTER FOR EVERYTHING</text>
  <text x="72" y="190" fill="#f0f6fc" class="sans" font-size="76" font-weight="800" letter-spacing="-2">BeatAPI CLI + SDK</text>
  <text x="76" y="242" fill="#7d8590" class="sans" font-size="22" font-weight="600">Route Agent capabilities from terminal and TypeScript</text>

  <g transform="translate(760 76)">
  <rect width="360" height="248" rx="18" fill="#111820" stroke="#7d8590" stroke-opacity=".45"/>
  <text x="24" y="42" fill="#2563FF" class="mono small">beatapi capabilities search</text>
  <path d="M24 64H336" stroke="#7d8590" stroke-opacity=".35"/>
  <rect x="24" y="88" width="132" height="40" rx="8" fill="#2563FF" fill-opacity=".12" stroke="#2563FF"/>
  <text x="42" y="114" fill="#2563FF" class="mono tiny">REQUEST</text>
  <path d="M162 108H218" stroke="#2563FF" stroke-width="2"/><path d="M210 101l9 7-9 7" fill="none" stroke="#2563FF" stroke-width="2"/>
  <rect x="224" y="88" width="112" height="40" rx="8" fill="#2563FF" fill-opacity=".12" stroke="#2563FF"/>
  <text x="246" y="114" fill="#2563FF" class="mono tiny">OUTPUT</text>
  <circle cx="36" cy="180" r="6" fill="#2563FF"/><path d="M48 180H310" stroke="#7d8590" stroke-width="2" stroke-dasharray="7 8"/>
  <circle cx="324" cy="180" r="6" fill="#2563FF"/>
  <text x="24" y="222" fill="#7d8590" class="mono tiny">REQUEST → TASK → VERIFIED OUTPUT</text>
</g>
</svg>
