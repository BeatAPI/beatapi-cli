<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">BeatAPI developer execution paths</title>
  <desc id="desc">The asynchronous path creates and polls tasks until hosted media is ready. The realtime path creates a short-lived session on a trusted server and passes only its client secret to the browser SDK.</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#7d8590" stroke-opacity="0.12"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10Z" fill="#3158e8"/>
    </marker>
  </defs>
  <style>
    .sans { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace; }
    .lane { font-size: 18px; font-weight: 800; letter-spacing: 1.5px; }
    .label { font-size: 18px; font-weight: 750; }
    .detail { font-size: 14px; font-weight: 550; }
    .code { font-size: 14px; font-weight: 650; }
  </style>
  <rect width="1200" height="520" rx="24" fill="#0b0f14"/>
  <rect width="1200" height="520" rx="24" fill="url(#grid)"/>

  <text x="64" y="70" fill="#f0f6fc" class="sans" font-size="30" font-weight="800">Two ways to build with BeatAPI</text>
  <text x="64" y="104" fill="#7d8590" class="sans" font-size="17">One typed contract for asynchronous workflows and short-lived realtime sessions.</text>

  <rect x="64" y="142" width="1072" height="144" rx="18" fill="#111820" stroke="#3158e8" stroke-opacity="0.7"/>
  <text x="88" y="178" fill="#3158e8" class="mono lane">ASYNC WORKFLOWS</text>
  <g class="sans">
    <rect x="88" y="202" width="190" height="58" rx="12" fill="#3158e8" fill-opacity="0.13" stroke="#3158e8"/>
    <text x="183" y="228" text-anchor="middle" fill="#f0f6fc" class="label">CLI or client</text>
    <text x="183" y="248" text-anchor="middle" fill="#7d8590" class="mono code">create(...)</text>

    <path d="M286 231H350" stroke="#3158e8" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="362" y="202" width="190" height="58" rx="12" fill="#3158e8" fill-opacity="0.13" stroke="#3158e8"/>
    <text x="457" y="228" text-anchor="middle" fill="#f0f6fc" class="label">Task ID</text>
    <text x="457" y="248" text-anchor="middle" fill="#7d8590" class="mono code">task_123</text>

    <path d="M560 231H624" stroke="#3158e8" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="636" y="202" width="190" height="58" rx="12" fill="#3158e8" fill-opacity="0.13" stroke="#3158e8"/>
    <text x="731" y="228" text-anchor="middle" fill="#f0f6fc" class="label">Bounded wait</text>
    <text x="731" y="248" text-anchor="middle" fill="#7d8590" class="mono code">tasks wait</text>

    <path d="M834 231H898" stroke="#3158e8" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="910" y="202" width="202" height="58" rx="12" fill="#3158e8" fill-opacity="0.13" stroke="#3158e8"/>
    <text x="1011" y="228" text-anchor="middle" fill="#f0f6fc" class="label">Structured result</text>
    <text x="1011" y="248" text-anchor="middle" fill="#7d8590" class="mono code">output.media</text>
  </g>

  <rect x="64" y="310" width="1072" height="144" rx="18" fill="#111820" stroke="#20a4a4" stroke-opacity="0.72"/>
  <text x="88" y="346" fill="#20a4a4" class="mono lane">REALTIME VIDEO</text>
  <g class="sans">
    <rect x="88" y="370" width="220" height="58" rx="12" fill="#20a4a4" fill-opacity="0.12" stroke="#20a4a4"/>
    <text x="198" y="396" text-anchor="middle" fill="#f0f6fc" class="label">Trusted server</text>
    <text x="198" y="416" text-anchor="middle" fill="#7d8590" class="mono code">sk_ API key</text>

    <path d="M316 399H402" stroke="#3158e8" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="414" y="370" width="240" height="58" rx="12" fill="#20a4a4" fill-opacity="0.12" stroke="#20a4a4"/>
    <text x="534" y="396" text-anchor="middle" fill="#f0f6fc" class="label">Create session</text>
    <text x="534" y="416" text-anchor="middle" fill="#7d8590" class="mono code">idempotency key</text>

    <path d="M662 399H748" stroke="#3158e8" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="760" y="370" width="352" height="58" rx="12" fill="#20a4a4" fill-opacity="0.12" stroke="#20a4a4"/>
    <text x="936" y="396" text-anchor="middle" fill="#f0f6fc" class="label">Browser SDK</text>
    <text x="936" y="416" text-anchor="middle" fill="#7d8590" class="mono code">short-lived client_secret only</text>
  </g>

  <text x="64" y="490" fill="#7d8590" class="sans detail">Long-lived API keys stay in trusted environments. CLI results use stdout; progress and errors use stderr.</text>
</svg>
